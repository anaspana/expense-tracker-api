services:
  db:
    image: postgres:17
    container_name: expensetracker-db
    environment:
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: expensetracker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_user -d expensetracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: